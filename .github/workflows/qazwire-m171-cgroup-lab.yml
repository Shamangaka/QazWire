name: QazWire M1.7.1 cgroup-v2 synthetic termination lab
on:
  push:
    branches:
      - feature/m1-7-1-cgroup-v2-lab
  pull_request:
    branches:
      - feature/m1-7-synthetic-klm-process

permissions:
  contents: read

jobs:
  m171:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Identify exact SHA and Go version
        run: |
          git rev-parse HEAD
          go version

      - name: Go formatting and shell script syntax
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd/qazwire-cgrouplab/*.go)"
          if [ -n "$files" ]; then
            echo "FAIL: gofmt differences:"
            gofmt -w cmd/qazwire-cgrouplab/*.go
            git diff -- cmd/qazwire-cgrouplab
            exit 1
          fi
          bash -n scripts/qazwire-m171-cgroup-lab.sh
          git diff --check

      - name: Safe parser and path-guard tests 10x race
        run: go test -tags qazwire_exp -race -count=10 -v ./cmd/qazwire-cgrouplab

      - name: Build synthetic cgroup child executable
        run: go build -tags qazwire_exp -o /tmp/qazwire-cgrouplab ./cmd/qazwire-cgrouplab

      - name: M1.7.0 IPC and M1.6.2 R5 regressions
        run: |
          go test -tags qazwire_exp -race -count=10 ./internal/qazwireexp/klmproc17 ./internal/qazwireexp/klm16 ./internal/qazwireexp/staged16
          python3 -I docs/qazwire/tools/r5_klm16_model.py --patched K3 K4 K6 > /tmp/model.txt
          cat /tmp/model.txt
          ! grep -q VIOLATED /tmp/model.txt

      - name: Full tagged tests and race detector
        run: |
          go test -tags qazwire_exp -count=1 ./...
          go test -tags qazwire_exp -race -count=1 ./...

      - name: Vet and untagged upstream tests
        run: |
          go vet -tags qazwire_exp ./...
          go test -count=1 ./...

      - name: Host integration limitation
        run: |
          echo 'ACTUAL cgroup.kill on real systemd user service NOT executed in generic CI.'
          echo 'Owner Ubuntu host script must be separately executed with exact SHA.'
