name: QazWire M1.6 synthetic ownership lab
on:
  push:
    branches:
      - feature/m1-6-exclusive-key-ownership

permissions:
  contents: read

jobs:
  klm16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Environment
        run: |
          go version
          git rev-parse HEAD

      - name: Format and whitespace
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/qazwireexp/klm16/*.go)"
          git diff --check

      - name: M1.6 ten race repetitions
        run: go test -tags qazwire_exp -race -count=10 ./internal/qazwireexp/klm16

      - name: Reject external owner copy and forged ticket at compile time
        run: |
          set -euo pipefail
          set +e
          go test -tags qazwire_exp ./internal/qazwireexp/klm16/testdata/negative > /tmp/m16-negative-build.log 2>&1
          rc=$?
          set -e
          cat /tmp/m16-negative-build.log
          test "$rc" -ne 0
          grep -q 'cannot indirect owner' /tmp/m16-negative-build.log
          grep -q 'cannot refer to unexported field state' /tmp/m16-negative-build.log

      - name: Full experimental tests
        run: go test -tags qazwire_exp -count=1 ./...

      - name: Full experimental race tests
        run: go test -tags qazwire_exp -race -count=1 ./...

      - name: Vet
        run: go vet -tags qazwire_exp ./...

      - name: Untagged upstream
        run: go test -count=1 ./...
